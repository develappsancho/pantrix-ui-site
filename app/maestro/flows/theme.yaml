# The theme button turns the dark theme on and off, and names the theme it turns to next. It starts in the system's
# theme, so the flow goes there and back from either.
appId: ${APP_ID}
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    when:
      visible:
        id: "IconButton_theme"
        text: "Switch to the dark theme|Koyu temaya geç"
    commands:
      - tapOn:
          id: "IconButton_theme"
      - assertVisible:
          id: "IconButton_theme"
          text: "Switch to the light theme|Açık temaya geç"
      - tapOn:
          id: "IconButton_theme"
      - assertVisible:
          id: "IconButton_theme"
          text: "Switch to the dark theme|Koyu temaya geç"
- runFlow:
    when:
      visible:
        id: "IconButton_theme"
        text: "Switch to the light theme|Açık temaya geç"
    commands:
      - tapOn:
          id: "IconButton_theme"
      - assertVisible:
          id: "IconButton_theme"
          text: "Switch to the dark theme|Koyu temaya geç"
      - tapOn:
          id: "IconButton_theme"
      - assertVisible:
          id: "IconButton_theme"
          text: "Switch to the light theme|Açık temaya geç"
