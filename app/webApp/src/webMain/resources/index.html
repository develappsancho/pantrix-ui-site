<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Every page's address is its own, /docs/installation, and the same page is served for each: what it loads is
         found from the site's root, not from beside the address. -->
    <base href="/">
    <title>Pantrix UI</title>
    <meta name="description" content="A Compose Multiplatform design system for Android, iOS, the desktop and the web.">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- The tab's icon, the site's logo on every platform. A browser that reads SVG takes it, one that does not the ICO;
         iOS takes the square it cuts its own corners from for a page added to the home screen. -->
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- A browser that can run the app, one with Wasm, is marked `app`: it hides the page's static words, the #static
         box the build writes for each page, and draws the app, in its Wasm build or its JavaScript one (site.js). One
         that cannot, or runs no script, keeps the words. -->
    <script>
        if (typeof WebAssembly === "object") document.documentElement.className = "app";
    </script>
    <!-- The site's typefaces are fetched while its code is, so they are there when the app asks for them. The
         addresses are the ones Compose's resource reader asks for; without `crossorigin` the browser does not count
         these fetches as those requests. Pantrix's own typeface first and its fallback for a Mac's keys, then the site's
         fallbacks, for Arabic and for its own marks, and its code typeface. -->
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.foundation.generated.resources/font/plus_jakarta_sans.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.foundation.generated.resources/font/pantrix_symbols.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.site.core.designsystem.generated.resources/font/noto_sans_arabic.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.site.core.designsystem.generated.resources/font/site_symbols.ttf">
    <link rel="preload" as="fetch" type="font/ttf" crossorigin
          href="composeResources/com.pantrixui.site.core.designsystem.generated.resources/font/jetbrains_mono_medium.ttf">
</head>
<body>
    <!-- The loading mark: it stays over the app until its first frame is drawn, then it is removed (main.kt). -->
    <div id="loading" role="presentation">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" stroke="#e7e9ed" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#2264ff" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <!-- The box the app is set in. -->
    <div id="app"></div>
    <!-- Starts the app in the build the browser can run: Wasm, or JavaScript where Wasm cannot run it. -->
    <script type="application/javascript" src="site.js"></script>
</body>
</html>
