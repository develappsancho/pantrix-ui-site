# Pantrix UI's site as it runs on a host: its files behind nginx (`web`), and beside it the site's server (`server`),
# which only nginx reaches, at /mcp. The same stack runs on this machine (with compose.local.yaml) and on the host.
# docs/deploy/ARCHITECTURE_GUIDE.md draws it.
name: pantrix-ui-site

services:
  web:
    image: ghcr.io/develappsancho/pantrix-ui-site-web:${SITE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server

  server:
    image: ghcr.io/develappsancho/pantrix-ui-site-server:${SITE_TAG:-latest}
    restart: unless-stopped
    # Reached by nginx on the stack's own network, and published on no port of the host.
    expose:
      - "8080"
    # The host runs other applications: the server's Java takes three quarters of this for its heap, and no more.
    deploy:
      resources:
        limits:
          memory: 512M
