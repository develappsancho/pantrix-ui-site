#Kotlin
kotlin.code.style=official
# Wasm and the iOS framework are linked in the Kotlin daemon; they need more room than a JVM module.
kotlin.daemon.jvmargs=-Xmx4g

#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Site
# The site's address, with no slash at its end: what its static pages, its sitemap, llms.txt and its share images are
# written with, and what an app, opened at no address, gives. A running stack is served at SITE_URL instead
# (deploy/compose.yaml), and the web app reads the address it was opened at.
site.url=https://pantrixui.com

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
