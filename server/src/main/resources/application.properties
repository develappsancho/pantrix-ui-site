spring.application.name=pantrix-ui-site-server
spring.main.banner-mode=off
# The host gives the port in PORT; on a machine of its own the server listens on 8080.
server.port=${PORT:8080}
# The site's address: SITE_URL where the stack is served (deploy/compose.yaml), or, where it gives none, the one the
# site is built for, site.url in gradle.properties, which the build writes here. Its pages may call the MCP server.
pantrix.site.url=${SITE_URL:}
pantrix.site.built-url=@siteUrl@
# The MCP SDK writes several lines for each request's session, which a stateless server opens and closes every time.
logging.level.io.modelcontextprotocol=WARN
