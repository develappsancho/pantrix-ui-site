spring.application.name=pantrix-ui-site-server
spring.main.banner-mode=off
# The host gives the port in PORT; on a machine of its own the server listens on 8080.
server.port=${PORT:8080}
# The hosts whose pages may call the MCP server from a browser.
pantrix.mcp.origins=pantrixui.com,www.pantrixui.com
# The MCP SDK writes several lines for each request's session, which a stateless server opens and closes every time.
logging.level.io.modelcontextprotocol=WARN
